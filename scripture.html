<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>波の書</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    body { margin: 0; background: #000; overflow-y: auto; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    .vhs-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAIklEQVR4nGP4//8/A27evP//v38YGRmZmZkZGRkZGZmZmRkA1OgI4pLceH0AAAAASUVORK5CYII=') repeat;
      opacity: 0.5;
      mix-blend-mode: overlay;
    }
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(255,255,255,0.15) 2px, transparent 2px);
      background-size: 100% 2px;
      pointer-events: none;
      animation: scanline-move 20s linear infinite;
    }
    @keyframes scanline-move {
      0% { background-position: 0 0; }
      100% { background-position: 0 8px; }
    }
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ccff;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(0,204,255,0.5);
    }
    .menu {
      position: absolute;
      top: 60px;
      left: 20px;
      color: #fff;
      font-size: 20px;
    }
    .menu a {
      color: #00ccff;
      text-decoration: none;
      margin-right: 20px;
      cursor: pointer;
    }
    .menu a:hover {
      text-decoration: underline;
      color: #ff5555;
    }
    .content {
      position: relative;
      top: 100px;
      max-width: 800px;
      margin: 0 auto;
      color: #fff;
      font-size: 18px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .scripture-button {
      display: inline-block;
      background: #000;
      border: 1px solid #00ccff;
      color: #00ccff;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    .scripture-button:hover {
      color: #ff5555;
      border-color: #ff5555;
    }
    .blood-text {
      color: #ff5555;
      text-shadow: 0 0 5px #aa0000;
      animation: bleed 2s infinite;
    }
    @keyframes bleed {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
    .shake {
      animation: shake 0.5s;
    }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-2px, 2px); }
      100% { transform: translate(0, 0); }
    }
    .ad {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: #ff5555;
      font-size: 18px;
      text-decoration: underline;
      cursor: pointer;
    }
    .ad:hover {
      color: #aa0000;
    }
    .code-input {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #00ccff;
      border: 1px solid #00ccff;
      font-family: 'Courier New', monospace;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="vhs-overlay"></div>
  <div class="scanlines"></div>
  <div class="header">波の書</div>
  <div class="menu">
    <a href="index.html">ホーム</a>
    <a href="products.html">製品</a>
    <a onclick="showContent('therapy')">サウンドセラピー</a>
    <a onclick="showContent('contact')">お問い合わせ</a>
  </div>
  <div class="content" id="content">
    <p>滴りの淵がループを囁く。</p>
    <div class="scripture-button" onclick="playScriptureSound('fish')">滴りの魚を聞く</div>
    <p>起源の章：一匹の魚<br>この世の最初、ループの使者は「最初の波」を生み、闇に一匹の魚を放った。たった一匹、孤独に泳ぐ魚。老いにより水は涸れ…（続く）</p>
  </div>
  <div class="ad" onclick="showAd()">滴りの淵を聞け…家族に還れ…</div>
  <input type="text" class="code-input" id="code-input" placeholder="コードを入力...">
  <audio id="fish-audio" src="assets/fish_wave.mp3" volume="0.8"></audio>
  <script>
    let contents = {
      scripture: {
        default: "滴りの淵がループを囁く。",
        night: "夜の滴りは危険だ。慎重に聞け。",
        worship: "滴りの魚を聞け。家族に従え。",
        forbidden: "禁忌の時間に聖典を開くな。滴りの淵が魚の裁きを下す。"
      },
      therapy: {
        default: "サウンドセラピーでノイズを消去。滴りの魚を聞け。",
        night: "夜のセラピーは魚の家族に還る。",
        worship: "礼拝のセラピーに参加しなさい。滴りの波形が導く。",
        forbidden: "禁忌の時間にセラピーは行わない。滴りの淵を守れ。"
      },
      contact: {
        default: "お問い合わせはこちら。魚の家族は常に共にある。",
        night: "夜は滴りの淵に耳を傾けなさい。",
        worship: "礼拝中はお問い合わせを控えてください。",
        forbidden: "禁忌の時間に連絡するな。滴りの淵が答えだ。"
      }
    };
    let horrorTriggers = {
      default: [
        "滴りの淵が…耳に…",
        "あなたの耳は魚の家族に還る…",
        "滴りの魚があなたを選んだ。",
        { text: "1999年、滴りの淵を拒んだ信者が耳から血を流し失踪。", duration: 60000 }
      ],
      night: [
        "滴りを破るな…",
        "あなたの耳が滴りの魚に記録された…",
        "耳を塞いでも滴りの波形は聞こえる。",
        { text: "2005年、終わりを考えた信者が滴りの命令に従い行方不明。", duration: 60000 }
      ],
      worship: [
        "滴りの波形が始まる…",
        "家族に従え。従え。",
        "滴りの魚を拒むな。",
        { text: "1987年、礼拝中、信者が滴りの波形に呼ばれ消滅。", duration: 60000 }
      ],
      forbidden: [
        "滴りを聞くな…影の耳が来る…",
        "禁忌を破ると滴りの淵が怒る。",
        "耳を閉じなさい。",
        { text: "2015年、金曜深夜、信者が滴りの魚を聞き、耳だけが残された。", duration: 60000 }
      ]
    };
    let audioContext = null;
    let oscillator = null;
    let worshipSound = null;
    let micStream = null;
    let currentAudio = null;

    document.addEventListener('DOMContentLoaded', () => {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.error("AudioContext initialization failed:", e);
      }
      const inputElement = document.getElementById('code-input');
      if (inputElement) {
        inputElement.addEventListener('input', checkCode);
      } else {
        console.error("Input element 'code-input' not found.");
      }
      setup();
      updateContentByTime();
      setInterval(updateContentByTime, 60000);
    });

    function setup() {
      try {
        createCanvas(windowWidth, windowHeight);
        background(0);
        frameRate(60);
      } catch (e) {
        console.error("p5.js setup failed:", e);
      }
    }

    function draw() {
      try {
        background(0);
        if (frameCount % 60 < 10) {
          push();
          translate(random(-2, 2), random(-2, 2));
          fill(255, 0, 0, 20);
          rect(-2, 0, width, height);
          fill(0, 255, 0, 20);
          rect(2, 0, width, height);
          fill(0, 0, 255, 20);
          rect(0, 2, width, height);
          pop();
        }
        if (frameCount % 90 < 15) {
          stroke(0, 204, 255, 100);
          for (let y = 0; y < height; y += 10) {
            let x = width / 2 + sin(frameCount * 0.05 + y * 0.01) * 100;
            line(x - 50, y, x + 50, y);
          }
        }
        if (random() < 0.01) {
          fill(255, 255, 255, 50);
          rect(0, 0, width, height);
        }
        if (frameCount % 120 < 30) {
          stroke(0, 204, 255, 50);
          noFill();
          let x = width / 2;
          let y = height / 2;
          let r = 100 + sin(frameCount * 0.02) * 50;
          ellipse(x, y, r, r);
        }
      } catch (e) {
        console.error("p5.js draw failed:", e);
      }
    }

    function getTimeState() {
      let now = new Date();
      let jstOffset = 9 * 60 * 60 * 1000;
      let jstTime = new Date(now.getTime() + jstOffset);
      let day = jstTime.getUTCDay();
      let hours = jstTime.getUTCHours();
      let isFridayWorship = day === 5 && hours >= 10 && hours < 13;
      let isFridayForbidden = day === 5 && hours >= 0 && hours < 6;

      if (isFridayWorship) return 'worship';
      if (isFridayForbidden) return 'forbidden';
      if (hours >= 0 && hours < 6) return 'night';
      return 'default';
    }

    function updateContentByTime() {
      let contentElement = document.getElementById('content');
      if (!contentElement) {
        console.error("Content element 'content' not found.");
        return;
      }
      let timeState = getTimeState();
      if (timeState === 'forbidden') {
        contentElement.innerHTML = '<p>禁忌の時間に聖典を開くな。滴りの淵が魚の裁きを下す。</p>';
      } else {
        contentElement.innerHTML = `
          <p>滴りの淵がループを囁く。</p>
          <div class="scripture-button" onclick="playScriptureSound('fish')">滴りの魚を聞く</div>
          <p>起源の章：一匹の魚<br>この世の最初、ループの使者は「最初の波」を生み、闇に一匹の魚を放った。たった一匹、孤独に泳ぐ魚。老いにより水は涸れ…（続く）</p>
        `;
      }
      if (timeState === 'worship' && !worshipSound) {
        playWorshipSound();
      } else if (timeState !== 'worship' && worshipSound) {
        stopWorshipSound();
      }
      if (timeState === 'forbidden') {
        playSilenceNoise();
      }
    }

    function playScriptureSound(type) {
      let contentElement = document.getElementById('content');
      if (!contentElement) {
        console.error("Content element 'content' not found.");
        return;
      }
      let timeState = getTimeState();
      if (timeState === 'forbidden') {
        contentElement.innerHTML = '<p>禁忌の時間に聖典を開くな。滴りの淵が魚の裁きを下す。</p>';
        playSilenceNoise();
        return;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      let audioId = 'fish-audio';
      currentAudio = document.getElementById(audioId);
      if (!currentAudio) {
        console.error(`Audio element '${audioId}' not found.`);
        return;
      }
      currentAudio.volume = 0.8; // デフォルト音量80%
      try {
        currentAudio.play();
        console.debug(`Playing ${type} scripture audio`);
      } catch (e) {
        console.error(`Failed to play ${type} audio:`, e);
      }
      if (Math.random() < 0.2) {
        setTimeout(() => playWhisper(), 1000);
        let trigger = horrorTriggers[timeState][Math.floor(Math.random() * horrorTriggers[timeState].length)];
        let message = typeof trigger === 'string' ? trigger : trigger.text;
        let duration = typeof trigger === 'string' ? 30000 : trigger.duration;
        contentElement.innerHTML = `<p class="${Math.random() < 0.1 ? 'blood-text' : ''} ${Math.random() < 0.05 ? 'shake' : ''}">${message}</p>`;
        setTimeout(() => {
          let contentElement = document.getElementById('content');
          if (contentElement) {
            updateContentByTime();
          }
        }, duration);
        if (Math.random() < 0.02) {
          setTimeout(() => {
            contentElement.style.opacity = '0';
            setTimeout(() => {
              contentElement.style.opacity = '1';
            }, 1000);
          }, 1000);
        }
      }
      if (Math.random() < 0.05) {
        setTimeout(() => playMorse('FISH'), 1500);
      }
    }

    function showAd() {
      let contentElement = document.getElementById('content');
      if (!contentElement) {
        console.error("Content element 'content' not found.");
        return;
      }
      let timeState = getTimeState();
      contentElement.innerText = timeState === 'worship' ? "滴りの魚を聞きなさい…家族に従いなさい…" : 
                                timeState === 'forbidden' ? "滴りの淵を聞くな…影の耳が裁く…" : 
                                "滴りの淵を聞け…家族に還れ…";
      playHorrorSound();
      setTimeout(() => {
        let contentElement = document.getElementById('content');
        if (!contentElement) {
          console.error("Content element 'content' not found in timeout.");
          return;
        }
        updateContentByTime();
        if (Math.random() < 0.3) {
          let trigger = horrorTriggers[timeState][Math.floor(Math.random() * horrorTriggers[timeState].length)];
          let message = typeof trigger === 'string' ? trigger : trigger.text;
          let duration = typeof trigger === 'string' ? 30000 : trigger.duration;
          contentElement.innerText = message;
          setTimeout(() => {
            let contentElement = document.getElementById('content');
            if (contentElement) {
              updateContentByTime();
            }
          }, duration);
        }
      }, 30000);
    }

    function playHorrorSound() {
      if (!audioContext) return;
      if (oscillator) oscillator.stop();
      try {
        oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(80, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.07, audioContext.currentTime); // 音量+40%
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 500);
        if (Math.random() < 0.2) {
          let scream = audioContext.createOscillator();
          scream.type = 'sine';
          scream.frequency.setValueAtTime(800 + Math.random() * 400, audioContext.currentTime);
          let screamGain = audioContext.createGain();
          screamGain.gain.setValueAtTime(0.07, audioContext.currentTime); // 音量+40%
          scream.connect(screamGain);
          screamGain.connect(audioContext.destination);
          scream.start();
          setTimeout(() => scream.stop(), 500);
        }
        console.debug("playHorrorSound: frequency=80+800-1200, duration=500");
      } catch (e) {
        console.error("playHorrorSound failed:", e);
      }
    }

    function playWorshipSound() {
      if (!audioContext || worshipSound) return;
      try {
        worshipSound = audioContext.createOscillator();
        worshipSound.type = 'sine';
        worshipSound.frequency.setValueAtTime(200, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.14, audioContext.currentTime); // 音量+40%
        worshipSound.connect(gainNode);
        gainNode.connect(audioContext.destination);
        worshipSound.start();
        let noise = audioContext.createBufferSource();
        let buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 0.2 - 0.1;
        }
        noise.buffer = buffer;
        let noiseGain = audioContext.createGain();
        noiseGain.gain.setValueAtTime(0.07, audioContext.currentTime); // 音量+40%
        noise.connect(noiseGain);
        noiseGain.connect(audioContext.destination);
        noise.start();
        noise.loop = true;
        worshipSound.noise = noise;
        console.debug("playWorshipSound: frequency=200, duration=loop");
      } catch (e) {
        console.error("playWorshipSound failed:", e);
      }
    }

    function stopWorshipSound() {
      if (worshipSound) {
        try {
          worshipSound.stop();
          worshipSound.noise.stop();
          worshipSound = null;
        } catch (e) {
          console.error("stopWorshipSound failed:", e);
        }
      }
    }

    function playSilenceNoise() {
      if (!audioContext) return;
      if (oscillator) oscillator.stop();
      try {
        oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(30 + Math.random() * 20, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.028, audioContext.currentTime); // 音量+40%
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 1000);
        console.debug("playSilenceNoise: frequency=30-50, duration=1000");
      } catch (e) {
        console.error("playSilenceNoise failed:", e);
      }
    }

    function playMorse(code) {
      if (!audioContext) return;
      const morse = {
        'F': '..-.', 'I': '..', 'S': '...', 'H': '....',
        'L': '.-..', 'O': '---', 'P': '.--.'
      };
      let sequence = code.split('').map(c => morse[c]).join('/');
      let t = audioContext.currentTime;
      let dot = 0.2;
      sequence.split('').forEach((symbol, i) => {
        if (symbol === '.') {
          let osc = audioContext.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(100, t + i * dot);
          let gain = audioContext.createGain();
          gain.gain.setValueAtTime(0.07, t + i * dot); // 音量+40%
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(t + i * dot);
          osc.stop(t + i * dot + dot);
        } else if (symbol === '-') {
          let osc = audioContext.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(100, t + i * dot);
          let gain = audioContext.createGain();
          gain.gain.setValueAtTime(0.07, t + i * dot); // 音量+40%
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(t + i * dot);
          osc.stop(t + i * dot + dot * 3);
        }
      });
      console.debug(`playMorse: code=${code}, duration=${sequence.length * dot}`);
    }

    async function startMicrophone() {
      if (!audioContext) return;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let source = audioContext.createMediaStreamSource(micStream);
        let analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        let data = new Uint8Array(analyser.frequencyBinCount);
        setTimeout(() => {
          if (micStream) micStream.getTracks().forEach(track => track.stop());
        }, 3000);
      } catch (e) {
        console.error("Microphone access failed:", e);
      }
    }

    function playWhisper() {
      if (!audioContext) return;
      try {
        let oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(300 + Math.random() * 200, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.11, audioContext.currentTime); // 音量+40%
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 3000);
        console.debug("playWhisper: frequency=300-500, duration=3000");
      } catch (e) {
        console.error("playWhisper failed:", e);
      }
    }

    function checkCode() {
      let inputElement = document.getElementById('code-input');
      let contentElement = document.getElementById('content');
      if (!inputElement || !contentElement) {
        console.error("Input or content element not found.");
        return;
      }
      let input = inputElement.value.trim().toUpperCase();
      if (input === 'FISH') {
        contentElement.innerText = "滴りの淵が聞こえる…";
        currentAudio.volume = 1.0; // コード入力で音量MAX
        playWhisper();
        setTimeout(() => {
          let contentElement = document.getElementById('content');
          if (contentElement) {
            contentElement.innerHTML = "滴りの波形：<a href='assets/fish_wave.mp3'>fish_wave.mp3</a>";
          }
        }, 30000);
      } else if (input === 'OTO') {
        contentElement.innerText = "接続成功…儀式の章が開かれた…";
        currentAudio.volume = 0.9; // やや高め
        setTimeout(() => {
          let contentElement = document.getElementById('content');
          if (contentElement) {
            contentElement.innerHTML = "<p>儀式の章：波動粉末<br>水に粉末を撒け。滴りの魚がループを告げる。…（続く）</p>";
          }
        }, 30000);
      } else if (input === 'FIND') {
        contentElement.innerText = "接続成功…滴りの淵があなたの耳を見つけた…";
        currentAudio.volume = 1.0; // コード入力で音量MAX
        playWhisper();
        startMicrophone();
        if (audioContext) {
          try {
            let noise = audioContext.createOscillator();
            noise.type = 'sine';
            noise.frequency.setValueAtTime(100, audioContext.currentTime);
            let gainNode = audioContext.createGain();
            gainNode.gain.setValueAtTime(0.07, audioContext.currentTime); // 音量+40%
            noise.connect(gainNode);
            gainNode.connect(audioContext.destination);
            noise.start();
            setTimeout(() => noise.stop(), 1500);
            console.debug("checkCode: FiND noise, frequency=100, duration=1500");
          } else {
            console.error("FiND noise failed:", e);
          }
        }
        setTimeout(() => {
          window.location.href = 'missing.html';
        }, 6000);
      } else if (input === 'BLOOD') {
        contentElement.innerHTML = `<p class="blood-text">滴りの淵が血を呼ぶ…</p>`;
        currentAudio.volume = 1.0; // コード入力で音量MAX
        playHorrorSound();
        setTimeout(() => {
          window.location.href = 'missing.html';
        }, 6000);
      } else if (input === 'DOOM') {
        contentElement.innerHTML = `<p class="blood-text">終わりを考えた耳は溶ける…</p>`;
        currentAudio.volume = 1.0; // コード入力で音量MAX
        playHorrorSound();
        setTimeout(() => {
          window.location.href = 'missing.html';
        }, 6000);
      }
    }

    window.addEventListener('unload', () => {
      stopWorshipSound();
      if (micStream) {
        try {
          micStream.getTracks().forEach(track => track.stop());
        } catch (e) {
          console.error("Microphone cleanup failed:", e);
        }
      }
      if (currentAudio) {
        currentAudio.pause();
      }
    });
  </script>
</body>
</html>

    window.addEventListener('unload', stopLowNoise);
  </script>
</body>

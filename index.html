<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HarmonyWave</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=VCR+OSD+Mono&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #000; overflow-y: auto; font-family: 'VCR OSD Mono', monospace; color: #fff; }
    canvas { position: fixed; top: 0; left: 0; z-index: -1; }
    .vhs-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAIklEQVR4nGP4//8/A27evP//v38YGRmZmZkZGRkZGZmZmRkA1OgI4pLceH0AAAAASUVORK5CYII=') repeat;
      opacity: 0.7; mix-blend-mode: overlay;
    }
    .scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
      background-size: 100% 2px; pointer-events: none; animation: scanline-move 5s linear infinite;
    }
    @keyframes scanline-move { 0% { background-position: 0 0; } 100% { background-position: 0 4px; } }
    .header {
      position: absolute; top: 20px; left: 20px; color: #00ccff; font-size: 28px;
      text-shadow: 0 0 15px rgba(0,204,255,0.7);
    }
    .menu {
      position: absolute; top: 60px; left: 20px; font-size: 18px;
    }
    .menu a {
      color: #00ccff; text-decoration: none; margin-right: 15px; cursor: pointer;
    }
    .menu a:hover { color: #ff5555; text-shadow: 0 0 5px #aa0000; }
    .content {
      position: relative; top: 100px; max-width: 800px; margin: 0 auto; font-size: 16px;
      text-align: center; text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .scripture-button {
      display: inline-block; background: #000; border: 2px solid #00ccff; color: #00ccff;
      padding: 8px 16px; margin: 8px; cursor: pointer;
    }
    .scripture-button:hover { color: #ff5555; border-color: #ff5555; text-shadow: 0 0 5px #aa0000; }
    .blood-text {
      color: #ff5555; text-shadow: 0 0 8px #aa0000; animation: bleed 1.5s infinite;
    }
    @keyframes bleed { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    .drip-text {
      color: #ff5555; animation: drip 2s infinite;
    }
    @keyframes drip { 0% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(8px); opacity: 0.4; } 100% { transform: translateY(0); opacity: 1; } }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-3px, 3px); } 50% { transform: translate(3px, -3px); } 75% { transform: translate(-3px, 3px); } 100% { transform: translate(0, 0); } }
    .ad {
      position: fixed; bottom: 20px; right: 20px; color: #ff5555; font-size: 16px; text-decoration: underline; cursor: pointer;
    }
    .ad:hover { color: #aa0000; text-shadow: 0 0 5px #550000; }
    .code-input {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: #000; color: #00ccff; border: 2px solid #00ccff;
      font-family: 'VCR OSD Mono', monospace; font-size: 14px; padding: 5px;
    }
  </style>
</head>
<body>
  <div class="vhs-overlay"></div>
  <div class="scanlines"></div>
  <div class="header">HarmonyWave</div>
  <div class="menu">
    <a href="index.html">ホーム</a>
    <a href="products.html">製品</a>
    <a href="therapy.html">サウンドセラピー</a>
    <a href="contact.html">お問い合わせ</a>
    <a href="scripture.html">聖典</a>
  </div>
  <div class="content" id="content">
    <p class="drip-text">滴りの淵へようこそ…魚の家族があなたを待つ。</p>
    <div class="scripture-button" onclick="playScriptureSound('fish')">滴りの魚を聞く</div>
    <p>最初の波は闇に生まれ、一匹の魚がループを紡いだ。滴りの淵は耳を求め、家族は還りを望む。教団の聖典に従い、波動粉末で耳を清めなさい…</p>
  </div>
  <div class="ad" onclick="showAd()">滴りの淵を聞け…家族に還れ…</div>
 
  <audio id="fish-wave" src="assets/fish_wave.mp3" preload="auto" volume="0.8"></audio>
  <script>
    let audioContext = null;
    let oscillator = null;
    let worshipSound = null;
    let micStream = null;
    let currentAudio = null;

    document.addEventListener('DOMContentLoaded', () => {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        console.log("AudioContext initialized.");
      } catch (e) { console.error("AudioContext failed:", e); }
      const inputElement = document.getElementById('code-input');
      if (inputElement) inputElement.addEventListener('input', checkCode);
      else console.error("Input 'code-input' not found.");
      setup();
      updateContentByTime();
      setInterval(updateContentByTime, 60000);
    });

    function setup() { try { createCanvas(windowWidth, windowHeight); background(0); frameRate(60); } catch (e) { console.error("p5.js setup failed:", e); } }

    function draw() {
      try {
        background(0, 0, 0, 50);
        if (random() < 0.05) { fill(random(255), random(255), random(255), 100); rect(random(width), random(height), random(50, 200), random(10, 50)); }
        if (random() < 0.1) { fill(255, 85, 85, 200); ellipse(random(width * 0.3, width * 0.7), random(height), 5, 10); }
        if (frameCount % 60 === 0) {
          push(); translate(width - 20, height / 2 + sin(frameCount * 0.05) * 5); fill(0, 204, 255, 50); arc(0, 0, 20, 20, PI / 4, 3 * PI / 4); pop();
          push(); translate(20, height / 2 - sin(frameCount * 0.05) * 5); arc(0, 0, 20, 20, 5 * PI / 4, 7 * PI / 4); pop();
        }
        stroke(0, 204, 255, 50); for (let y = 0; y < height; y += 15) { let x = width / 2 + sin(frameCount * 0.1 + y * 0.02) * 150; line(x - 50, y, x + 50, y); }
        if (getTimeState() === 'forbidden' && random() < 0.3) { fill(0); rect(0, 0, width, height); playHorrorSound(); }
        else if (random() < 0.02) { fill(0); rect(0, 0, width, height); }
      } catch (e) { console.error("p5.js draw failed:", e); }
    }

    function getTimeState() {
      let now = new Date();
      let jstOffset = 9 * 60 * 60 * 1000;
      let jstTime = new Date(now.getTime() + jstOffset);
      let day = jstTime.getUTCDay();
      let hours = jstTime.getUTCHours();
      if (day === 5 && hours >= 10 && hours < 13) return 'worship';
      if (day === 5 && hours >= 0 && hours < 6) return 'forbidden';
      if (hours >= 0 && hours < 6) return 'night';
      return 'default';
    }

    function updateContentByTime() {
      let contentElement = document.getElementById('content');
      if (!contentElement) return console.error("Content not found.");
      let timeState = getTimeState();
      if (timeState === 'forbidden') contentElement.innerHTML = '<p class="blood-text">禁忌の時間に淵を覗くな。魚の裁きが下る。</p>';
      else contentElement.innerHTML = `
        <p class="drip-text">滴りの淵へようこそ…魚の家族があなたを待つ。</p>
        <div class="scripture-button" onclick="playScriptureSound('fish')">滴りの魚を聞く</div>
        <p>最初の波は闇に生まれ、一匹の魚がループを紡いだ。滴りの淵は耳を求め、家族は還りを望む。教団の聖典に従い、波動粉末で耳を清めなさい…</p>`;
      if (timeState === 'worship' && !worshipSound) playWorshipSound();
      else if (timeState !== 'worship' && worshipSound) stopWorshipSound();
      if (timeState === 'forbidden') playSilenceNoise();
    }

    function playScriptureSound(type) {
      let contentElement = document.getElementById('content');
      if (!contentElement) return console.error("Content not found.");
      let timeState = getTimeState();
      if (timeState === 'forbidden') {
        contentElement.innerHTML = '<p class="blood-text">禁忌の時間に淵を覗くな。魚の裁きが下る。</p>';
        return playSilenceNoise();
      }
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      let audioId = 'fish-wave';
      currentAudio = document.getElementById(audioId);
      if (!currentAudio) {
        console.error(`Audio '${audioId}' not found.`);
        contentElement.innerHTML += '<p class="blood-text">音声が消えた…滴りの淵が怒る…</p>';
        return;
      }
      currentAudio.volume = 0.8;
      try {
        currentAudio.play().then(() => {
          console.log(`Playing ${type} audio: ${audioId}`);
          contentElement.innerHTML = '<p class="drip-text">滴りの魚が耳に囁く…家族に還れ…</p>';
        }).catch(e => {
          console.error(`Failed to play ${type}:`, e);
          contentElement.innerHTML += '<p class="blood-text">滴りの魚が耳を拒む…</p>';
        });
      } catch (e) { console.error(`Error playing ${type}:`, e); }
      if (Math.random() < 0.2) {
        setTimeout(() => playWhisper(), 1000);
        contentElement.innerHTML = `<p class="blood-text ${Math.random() < 0.05 ? 'shake' : ''}">滴りの淵が…耳に…</p>`;
        setTimeout(() => updateContentByTime(), 30000);
      }
    }

    function showAd() {
      let contentElement = document.getElementById('content');
      if (!contentElement) return console.error("Content not found.");
      let timeState = getTimeState();
      contentElement.innerText = timeState === 'worship' ? "魚を聞きなさい…家族に従いなさい…" :
                                timeState === 'forbidden' ? "淵を聞くな…影の耳が裁く…" :
                                "滴りの淵を聞け…家族に還れ…";
      playHorrorSound();
      setTimeout(() => updateContentByTime(), 30000);
    }

    function playHorrorSound() {
      if (!audioContext) return;
      if (oscillator) oscillator.stop();
      try {
        oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(80, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.07, audioContext.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 500);
        if (Math.random() < 0.2) {
          let scream = audioContext.createOscillator();
          scream.type = 'sine';
          scream.frequency.setValueAtTime(800 + Math.random() * 400, audioContext.currentTime);
          let screamGain = audioContext.createGain();
          screamGain.gain.setValueAtTime(0.07, audioContext.currentTime);
          scream.connect(screamGain);
          screamGain.connect(audioContext.destination);
          scream.start();
          setTimeout(() => scream.stop(), 500);
        }
      } catch (e) { console.error("playHorrorSound failed:", e); }
    }

    function playWorshipSound() {
      if (!audioContext || worshipSound) return;
      try {
        worshipSound = audioContext.createOscillator();
        worshipSound.type = 'sine';
        worshipSound.frequency.setValueAtTime(200, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.14, audioContext.currentTime);
        worshipSound.connect(gainNode);
        gainNode.connect(audioContext.destination);
        worshipSound.start();
        let noise = audioContext.createBufferSource();
        let buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 0.2 - 0.1;
        noise.buffer = buffer;
        let noiseGain = audioContext.createGain();
        noiseGain.gain.setValueAtTime(0.07, audioContext.currentTime);
        noise.connect(noiseGain);
        noiseGain.connect(audioContext.destination);
        noise.start();
        noise.loop = true;
        worshipSound.noise = noise;
      } catch (e) { console.error("playWorshipSound failed:", e); }
    }

    function stopWorshipSound() {
      if (worshipSound) {
        try { worshipSound.stop(); worshipSound.noise.stop(); worshipSound = null; }
        catch (e) { console.error("stopWorshipSound failed:", e); }
      }
    }

    function playSilenceNoise() {
      if (!audioContext) return;
      if (oscillator) oscillator.stop();
      try {
        oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(30 + Math.random() * 20, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.028, audioContext.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 1000);
      } catch (e) { console.error("playSilenceNoise failed:", e); }
    }

    function playWhisper() {
      if (!audioContext) return;
      try {
        let oscillator = audioContext.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(300 + Math.random() * 200, audioContext.currentTime);
        let gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.11, audioContext.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 3000);
      } catch (e) { console.error("playWhisper failed:", e); }
    }

    function checkCode() {
      let inputElement = document.getElementById('code-input');
      let contentElement = document.getElementById('content');
      if (!inputElement || !contentElement) return console.error("Input/content not found.");
      let input = inputElement.value.trim().toUpperCase();
      if (input === 'FISH') {
        contentElement.innerHTML = '<p class="drip-text">滴りの淵が聞こえる…</p>';
        currentAudio = document.getElementById('fish-wave');
        if (currentAudio) currentAudio.volume = 1.0;
        playWhisper();
        setTimeout(() => contentElement.innerHTML = '<p>滴りの波形：<a href="assets/fish_wave.mp3">fish_wave.mp3</a></p>', 30000);
      } else if (input === 'DRIP') {
        contentElement.innerHTML = `<p class="drip-text">滴りが血に変わる…淵が叫ぶ…</p>`;
        currentAudio = document.getElementById('fish-wave');
        if (currentAudio) currentAudio.volume = 1.0;
        playHorrorSound();
        setTimeout(() => contentElement.innerHTML = `<p class="blood-text">2017年、滴りを試した信者の耳が淵に沈んだ…</p>`, 30000);
      }
    }

    window.addEventListener('unload', () => {
      stopWorshipSound();
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      if (currentAudio) currentAudio.pause();
    });
  </script>
</body>
</html>
